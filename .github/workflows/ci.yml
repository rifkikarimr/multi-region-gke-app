name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install application dependencies
        run: python -m pip install --requirement app/requirements.txt

      - name: Run application tests
        run: python -m unittest discover -s app/tests -v

      - name: Validate container build
        run: docker build --tag multi-region-gke-app:ci app

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialize Terraform without a backend
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Validate Kubernetes overlays
        run: |
          kubectl kustomize kubernetes/overlays/us > /tmp/us-manifests.yaml
          kubectl kustomize kubernetes/overlays/eu > /tmp/eu-manifests.yaml
          grep -q "kind: Deployment" /tmp/us-manifests.yaml
          grep -q "value: us" /tmp/us-manifests.yaml
          grep -q "kind: Deployment" /tmp/eu-manifests.yaml
          grep -q "value: eu" /tmp/eu-manifests.yaml
          docker run --rm --interactive ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.33.0 - < /tmp/us-manifests.yaml
          docker run --rm --interactive ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.33.0 - < /tmp/eu-manifests.yaml
